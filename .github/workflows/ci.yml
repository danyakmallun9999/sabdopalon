name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  ui:
    name: Build dashboard UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Install & build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Upload UI bundle
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: internal/dashboard/ui/dist/

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Download prebuilt UI bundle (for go:embed)
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: internal/dashboard/ui/dist

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Verify formatting (gofmt)
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Run tests
        run: go test -race ./...
