name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build UI + all binaries + publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build all platform binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          mkdir -p dist
          build() {
            echo "::group::build $3 ($1/$2)"
            GOOS="$1" GOARCH="$2" go build -ldflags="-s -w" -o "dist/$3" ./cmd/sabdopalon
            echo "::endgroup::"
          }
          build linux   amd64 sabdopalon-linux-x86_64
          build linux   arm64 sabdopalon-linux-aarch64
          build darwin  amd64 sabdopalon-macos-x86_64
          build darwin  arm64 sabdopalon-macos-aarch64
          build windows amd64 sabdopalon-windows-x86_64.exe
          echo "binaries:"; ls -lh dist

      - name: Package release assets
        run: |
          set -e
          cd dist
          shopt -s nullglob
          for f in sabdopalon-windows-*.exe; do zip -q "$f.zip" "$f"; done
          for f in sabdopalon-linux-* sabdopalon-macos-*; do tar czf "$f.tar.gz" "$f"; done
          rm -f sabdopalon-windows-*.exe
          echo "archives:"; ls -lh

      - name: Verify assets exist (fail loud, never ship an empty release)
        run: |
          count=$(ls dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          listing=$(ls dist || true)
          test "$count" -eq 5 || {
            echo "::error::expected 5 archives (4 tar.gz + 1 zip), found $count | dist: $(echo "$listing" | tr '\n' ',')"
            exit 1
          }
          echo "verified 5 assets ✓"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
