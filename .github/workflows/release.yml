name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build UI + all binaries + publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build all platform binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/sabdopalon/sabdopalon/internal/app.Version=${VERSION}"
          mkdir -p dist
          build() {
            echo "::group::build $3 ($1/$2)"
            GOOS="$1" GOARCH="$2" go build -ldflags="$LDFLAGS" -o "dist/$3" ./cmd/sabdopalon
            echo "::endgroup::"
          }
          build linux   amd64 sabdopalon-linux-x86_64
          build linux   arm64 sabdopalon-linux-aarch64
          build darwin  amd64 sabdopalon-macos-x86_64
          build darwin  arm64 sabdopalon-macos-aarch64
          build windows amd64 sabdopalon-windows-x86_64.exe
          echo "binaries:"; ls -lh dist

      - name: Package release assets (full bundles)
        run: |
          set -e
          # Each archive contains a complete, runnable Sabdopalon install:
          # binary + default config + package registry + empty data dirs +
          # the one-click installer scripts.
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/bundle/config"
          DIST=$(pwd)/dist

          # Default (clean, machine-agnostic) engine.toml + package registry.
          cat > "$STAGE/bundle/config/engine.toml" <<'EOF'
          # Sabdopalon configuration — fresh install defaults.
          # Run `sabdopalon setup` (or the desktop wizard) to configure your stack.

          [sabdopalon]
          tld = "localhost"
          root = "./sites"
          logs = "./logs"
          data = "./data"

          [proxy]
          http_port = 8080
          https_port = 8443

          [php]
          binary = ""

          [database]
          engine = "sqlite"
          path = "./data/sabdopalon.db"
          port = 3306

          [dashboard]
          enabled = true
          port = 9900
          auto_open = true

          [services]
          mailpit = false
          redis = false
          minio = false
          meilisearch = false
          EOF

          cp -r packages "$STAGE/bundle/packages"
          cp scripts/install.sh scripts/install.ps1 "$STAGE/bundle/"

          # Empty but present data dirs (the binary self-heals, but shipping
          # them avoids any first-run surprise).
          for d in sites logs data bin certs backups config/vhosts config/profiles; do
            mkdir -p "$STAGE/bundle/$d"
            touch "$STAGE/bundle/$d/.gitkeep"
          done

          VERSION="${GITHUB_REF_NAME#v}"
          for f in "$DIST"/sabdopalon-linux-* "$DIST"/sabdopalon-macos-*; do
            cp "$f" "$STAGE/bundle/sabdopalon"
            tar czf "$f.tar.gz" -C "$STAGE" bundle
          done
          for f in "$DIST"/sabdopalon-windows-*.exe; do
            cp "$f" "$STAGE/bundle/sabdopalon.exe"
            (cd "$STAGE" && zip -q "${f}.zip" -r bundle)
          done
          # Remove the bare binaries (archives are the deliverables) — but
          # never the archives themselves: `sabdopalon-linux-*` would also
          # match the .tar.gz files just created.
          find "$DIST" -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.zip' -delete
          echo "archives:"; ls -lh "$DIST"

      - name: Verify assets exist (fail loud, never ship an empty release)
        run: |
          count=$(ls dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          listing=$(ls dist || true)
          test "$count" -eq 5 || {
            echo "::error::expected 5 archives (4 tar.gz + 1 zip), found $count | dist: $(echo "$listing" | tr '\n' ',')"
            exit 1
          }
          echo "verified 5 assets ✓"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip

  desktop:
    name: Desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles dmg
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build sidecar (Go)
        shell: bash
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip the leading "v" so the version string is "0.7.0" not "v0.7.0".
          VERSION="${VERSION#v}" bash scripts/build-sidecar.sh

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri deps (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Tauri build
        working-directory: desktop
        run: |
          npm ci
          npm run build -- --target ${{ matrix.target }} ${{ matrix.args }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/**/*
