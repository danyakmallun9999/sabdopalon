name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build UI + all binaries + publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build all platform binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/sabdopalon/sabdopalon/internal/app.Version=${VERSION}"
          mkdir -p dist
          build() {
            echo "::group::build $3 ($1/$2)"
            GOOS="$1" GOARCH="$2" go build -ldflags="$LDFLAGS" -o "dist/$3" ./cmd/sabdopalon
            echo "::endgroup::"
          }
          build linux   amd64 sabdopalon-linux-x86_64
          build linux   arm64 sabdopalon-linux-aarch64
          build darwin  amd64 sabdopalon-macos-x86_64
          build darwin  arm64 sabdopalon-macos-aarch64
          build windows amd64 sabdopalon-windows-x86_64.exe
          echo "binaries:"; ls -lh dist

      - name: Download core stack (PHP + MariaDB + phpMyAdmin) per platform
        run: |
          set -e
          mkdir -p core/linux-x86_64 core/macos-x86_64 core/macos-aarch64 core/windows
          cd core

          # --- phpMyAdmin (identical for all platforms) ---
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o pma.tar.gz https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-all-languages.tar.gz
          for d in linux-x86_64 macos-x86_64 macos-aarch64 windows; do
            mkdir -p "$d/bin/phpmyadmin"
            tar xzf pma.tar.gz -C "$d/bin/phpmyadmin" --strip-components=1
          done

          # --- PHP 8.5 (static-php.dev per platform; tarball berisi satu
          #     file `php` langsung di root — tanpa strip) ---
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o php-linux.tar.gz https://dl.static-php.dev/static-php-cli/common/php-8.5.8-cli-linux-x86_64.tar.gz
          mkdir -p linux-x86_64/bin/php/8.5 && tar xzf php-linux.tar.gz -C linux-x86_64/bin/php/8.5

          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o php-macos-x86_64.tar.gz https://dl.static-php.dev/static-php-cli/common/php-8.5.8-cli-macos-x86_64.tar.gz
          mkdir -p macos-x86_64/bin/php/8.5 && tar xzf php-macos-x86_64.tar.gz -C macos-x86_64/bin/php/8.5

          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o php-macos-aarch64.tar.gz https://dl.static-php.dev/static-php-cli/common/php-8.5.8-cli-macos-aarch64.tar.gz
          mkdir -p macos-aarch64/bin/php/8.5 && tar xzf php-macos-aarch64.tar.gz -C macos-aarch64/bin/php/8.5

          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o php-win.zip https://dl.static-php.dev/static-php-cli/windows/spc-min/php-8.5.7-cli-win.zip
          mkdir -p windows/bin/php/8.5 && (cd windows/bin/php/8.5 && unzip -q "$OLDPWD/php-win.zip")

          # --- MariaDB 11.4.13 (linux tar.gz + windows zip; macOS tidak
          #     tersedia di archive.mariadb.org — pengguna macOS memakai
          #     `sabdopalon add mariadb` atau Homebrew) ---
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o mariadb-linux.tar.gz https://archive.mariadb.org/mariadb-11.4.13/bintar-linux-systemd-x86_64/mariadb-11.4.13-linux-systemd-x86_64.tar.gz
          mkdir -p linux-x86_64/bin/mariadb && tar xzf mariadb-linux.tar.gz -C linux-x86_64/bin/mariadb --strip-components=1

          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o mariadb-win.zip https://archive.mariadb.org/mariadb-11.4.13/winx64-packages/mariadb-11.4.13-winx64.zip
          mkdir -p windows/bin/mariadb && (cd windows/bin/mariadb && unzip -q "$OLDPWD/mariadb-win.zip" && mv mariadb-11.4.13-winx64/* . && rmdir mariadb-11.4.13-winx64)

          echo "core stack sizes:"; du -sh linux-x86_64 macos-x86_64 macos-aarch64 windows

      - name: Package release assets (full bundles with core stack)
        run: |
          set -e
          # Each archive contains a complete, runnable Sabdopalon install:
          # binary + core stack (PHP/MariaDB/phpMyAdmin) + default config +
          # package registry + the one-click installer scripts.
          DIST=$(pwd)/dist

          # Default (clean, machine-agnostic) engine.toml + package registry.
          cat > /tmp/engine.toml <<'EOF'
          # Sabdopalon configuration — fresh install defaults.
          # The core stack (PHP + MariaDB + phpMyAdmin) ships inside bin/.

          [sabdopalon]
          tld = "localhost"
          root = "./sites"
          logs = "./logs"
          data = "./data"

          [proxy]
          http_port = 8080
          https_port = 8443

          [php]
          binary = ""

          [database]
          engine = "mariadb"
          path = "./data/sabdopalon.db"
          port = 3306

          [dashboard]
          enabled = true
          port = 9900
          auto_open = true

          [services]
          mailpit = true
          redis = true
          minio = true
          meilisearch = true
          EOF

          # build_bundle <core-dir> <binary> <archive-suffix> <tar|zip>
          build_bundle() {
            local core="$1" binfile="$2" suffix="$3" mode="$4"
            local stage
            stage=$(mktemp -d)
            mkdir -p "$stage/bundle/config" "$stage/bundle/packages"
            cp "$binfile" "$stage/bundle/sabdopalon"
            cp /tmp/engine.toml "$stage/bundle/config/engine.toml"
            cp -r packages "$stage/bundle/packages"
            cp scripts/install.sh scripts/install.ps1 "$stage/bundle/"
            for d in sites logs data certs backups config/vhosts config/profiles; do
              mkdir -p "$stage/bundle/$d"
              touch "$stage/bundle/$d/.gitkeep"
            done
            # Core stack (bin/php, bin/mariadb, bin/phpmyadmin)
            cp -r "core/$core/bin" "$stage/bundle/bin"
            if [ "$mode" = "tar" ]; then
              tar czf "$DIST/sabdopalon-$suffix.tar.gz" -C "$stage" bundle
            else
              (cd "$stage" && zip -qr "$DIST/sabdopalon-$suffix.zip" bundle)
            fi
            rm -rf "$stage"
          }

          build_bundle linux-x86_64    "dist/sabdopalon-linux-x86_64"    "linux-x86_64"    tar
          build_bundle linux-x86_64    "dist/sabdopalon-linux-aarch64"   "linux-aarch64"   tar
          build_bundle macos-x86_64    "dist/sabdopalon-macos-x86_64"    "macos-x86_64"    tar
          build_bundle macos-aarch64   "dist/sabdopalon-macos-aarch64"   "macos-aarch64"   tar
          build_bundle windows         "dist/sabdopalon-windows-x86_64.exe" "windows-x86_64.exe" zip

          # Remove the bare binaries (archives are the deliverables).
          find "$DIST" -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.zip' -delete
          echo "archives:"; ls -lh "$DIST"

      - name: Verify assets exist (fail loud, never ship an empty release)
        run: |
          count=$(ls dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          listing=$(ls dist || true)
          test "$count" -eq 5 || {
            echo "::error::expected 5 archives (4 tar.gz + 1 zip), found $count | dist: $(echo "$listing" | tr '\n' ',')"
            exit 1
          }
          echo "verified 5 assets ✓"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip

  desktop:
    name: Desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles dmg
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build sidecar (Go)
        shell: bash
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip the leading "v" so the version string is "0.7.0" not "v0.7.0".
          VERSION="${VERSION#v}" bash scripts/build-sidecar.sh

      - name: Download core stack into desktop resources (${{ matrix.name }})
        shell: bash
        working-directory: desktop
        run: |
          set -e
          CORE=src-tauri/resources/core
          mkdir -p "$CORE/php/8.5" "$CORE/phpmyadmin" "$CORE/mariadb"

          # phpMyAdmin (all platforms)
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/pma.tar.gz https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-all-languages.tar.gz
          tar xzf /tmp/pma.tar.gz -C "$CORE/phpmyadmin" --strip-components=1

          case "${{ matrix.name }}" in
            windows)
              curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/php.zip https://dl.static-php.dev/static-php-cli/windows/spc-min/php-8.5.7-cli-win.zip
              (cd "$CORE/php/8.5" && unzip -q /tmp/php.zip)
              curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/mariadb.zip https://archive.mariadb.org/mariadb-11.4.13/winx64-packages/mariadb-11.4.13-winx64.zip
              (cd "$CORE/mariadb" && unzip -q /tmp/mariadb.zip && mv mariadb-11.4.13-winx64/* . && rmdir mariadb-11.4.13-winx64)
              ;;
            macos)
              curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/php.tar.gz https://dl.static-php.dev/static-php-cli/common/php-8.5.8-cli-macos-aarch64.tar.gz
              tar xzf /tmp/php.tar.gz -C "$CORE/php/8.5"
              # MariaDB macOS: tidak tersedia upstream — via `add mariadb`/Homebrew
              rm -rf "$CORE/mariadb"
              ;;
            linux)
              curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/php.tar.gz https://dl.static-php.dev/static-php-cli/common/php-8.5.8-cli-linux-x86_64.tar.gz
              tar xzf /tmp/php.tar.gz -C "$CORE/php/8.5"
              curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/mariadb.tar.gz https://archive.mariadb.org/mariadb-11.4.13/bintar-linux-systemd-x86_64/mariadb-11.4.13-linux-systemd-x86_64.tar.gz
              tar xzf /tmp/mariadb.tar.gz -C "$CORE/mariadb" --strip-components=1
              # Drop Galera clustering bits + exotic engine plugins: useless
              # for local dev and bloat the bundle.
              rm -f "$CORE/mariadb/bin/garbd" \
                    "$CORE/mariadb/lib/libgalera_smm.so" \
                    "$CORE/mariadb/lib/plugin/ha_connect.so" \
                    "$CORE/mariadb/lib/plugin/ha_oqgraph.so"
              rm -rf "$CORE/mariadb/lib/galera"
              # Ship the core as ONE archive instead of an extracted tree:
              # linuxdeploy scans every ELF under the AppDir and fails when a
              # bundled binary links a lib the runner lacks (libaio…). The
              # sidecar extracts it into the writable bin dir on first run.
              # Archive is staged OUTSIDE $CORE — tar cannot read and write
              # the same file inside the tree it is walking.
              tar czf /tmp/sabdopalon-core.tar.gz -C "$CORE" .
              rm -rf "$CORE"
              mkdir -p "$CORE"
              mv /tmp/sabdopalon-core.tar.gz "$CORE/core.tar.gz"
              ;;
          esac

          echo "core resource sizes:"; du -sh "$CORE"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri deps (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          # AppImage bundling executes the linuxdeploy AppImage, which needs
          # FUSE at runtime. ubuntu-latest (24.04) no longer preinstalls it;
          # the t64 rename means the package name differs across releases.
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Tauri build
        working-directory: desktop
        env:
          # Belt-and-braces: make every AppImage (linuxdeploy included)
          # self-extract instead of requiring FUSE on headless runners.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npm ci
          npm run build -- --target ${{ matrix.target }} ${{ matrix.args }}

      - name: Verify desktop artifacts exist (fail loud)
        if: always()
        working-directory: desktop/src-tauri/target
        shell: bash
        run: |
          set -e
          echo "bundle trees:"; find . -path '*release/bundle*' -maxdepth 6 -type f | head -20 || true
          case "${{ matrix.name }}" in
            windows)  test -n "$(find . -path '*bundle*' -name '*-setup.exe' -type f | head -1)" ;;
            macos)    test -n "$(find . -path '*bundle*' -name '*.dmg' -type f | head -1)" ;;
            linux)    test -n "$(find . -path '*bundle*' \( -name '*.AppImage' -o -name '*.deb' \) -type f | head -1)" ;;
          esac && echo "artifacts OK"

      # NOTE: builds use --target <triple>, so bundles live under
      # target/<triple>/release/bundle — a plain target/release/bundle glob
      # matches NOTHING (silently skipped uploads in every past release!).
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/**/bundle/**/*.deb
            desktop/src-tauri/target/**/bundle/**/*.rpm
            desktop/src-tauri/target/**/bundle/**/*.AppImage
            desktop/src-tauri/target/**/bundle/**/*.msi
            desktop/src-tauri/target/**/bundle/**/*.dmg
            desktop/src-tauri/target/**/bundle/**/*-setup.exe
