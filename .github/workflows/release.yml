name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    name: Build dashboard UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: internal/dashboard/ui/dist/

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: ui
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            arch: x86_64
            goos: linux
            goarch: amd64
            binary: sabdopalon
          - os: linux
            arch: aarch64
            goos: linux
            goarch: arm64
            binary: sabdopalon
          # macOS (cross-compiled — Go does not require a matching host)
          - os: macos
            arch: x86_64
            goos: darwin
            goarch: amd64
            binary: sabdopalon
          - os: macos
            arch: aarch64
            goos: darwin
            goarch: arm64
            binary: sabdopalon
          # Windows (cross-compiled)
          - os: windows
            arch: x86_64
            goos: windows
            goarch: amd64
            binary: sabdopalon.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/dashboard/ui/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o ${{ matrix.binary }} ./cmd/sabdopalon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabdopalon-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.binary }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          cd dist
          shopt -s nullglob
          # Each artifact downloads into its own subdirectory:
          #   dist/sabdopalon-<os>-<arch>/sabdopalon[.exe]
          # Flatten into correctly-named release archives at dist/ root.
          for d in sabdopalon-*/; do
            d="${d%/}"
            suffix="${d#sabdopalon-}"
            if [[ "$suffix" == windows-* ]]; then
              src="$d/sabdopalon.exe"
              out="sabdopalon-${suffix}.exe"
              if [ -f "$src" ]; then
                cp "$src" "$out"
                zip -q "${out}.zip" "$out"
                rm -f "$out"
              fi
            else
              src="$d/sabdopalon"
              out="sabdopalon-${suffix}"
              if [ -f "$src" ]; then
                cp "$src" "$out"
                tar czf "${out}.tar.gz" "$out"
                rm -f "$out"
              fi
            fi
            rm -rf "$d"
          done
          echo "Release assets ready:"
          ls -lh

      - name: Verify assets exist (fail loud, never ship an empty release)
        run: |
          count=$(ls dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          echo "asset archives: $count"
          test "$count" -eq 5 || {
            echo "::error::expected 5 archives (4 tar.gz + 1 zip), found $count"
            exit 1
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
