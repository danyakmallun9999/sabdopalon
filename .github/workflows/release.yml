name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    name: Build dashboard UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: internal/dashboard/ui/dist/

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: ui
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            arch: x86_64
            goos: linux
            goarch: amd64
            binary: sabdopalon
          - os: linux
            arch: aarch64
            goos: linux
            goarch: arm64
            binary: sabdopalon
          # macOS (cross-compiled — Go does not require a matching host)
          - os: macos
            arch: x86_64
            goos: darwin
            goarch: amd64
            binary: sabdopalon
          - os: macos
            arch: aarch64
            goos: darwin
            goarch: arm64
            binary: sabdopalon
          # Windows (cross-compiled)
          - os: windows
            arch: x86_64
            goos: windows
            goarch: amd64
            binary: sabdopalon.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/dashboard/ui/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.binary }} ./cmd/sabdopalon
          # Upload with the FINAL asset name so the release job can flatten.
          name="sabdopalon-${{ matrix.os }}-${{ matrix.arch }}"
          case "${{ matrix.binary }}" in *.exe) name="$name.exe";; esac
          cp "${{ matrix.binary }}" "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabdopalon-${{ matrix.os }}-${{ matrix.arch }}
          path: sabdopalon-${{ matrix.os }}-${{ matrix.arch }}*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts (flat)
        uses: actions/download-artifact@v4
        with:
          pattern: sabdopalon-*
          path: dist
          merge-multiple: true

      - name: Package release assets
        run: |
          set -e
          cd dist
          shopt -s nullglob
          for f in sabdopalon-windows-*.exe; do zip -q "$f.zip" "$f"; done
          for f in sabdopalon-linux-* sabdopalon-macos-*; do tar czf "$f.tar.gz" "$f"; done
          rm -f sabdopalon-linux-* sabdopalon-macos-* sabdopalon-windows-*.exe
          echo "Assets ready:"; ls -lh

      - name: Verify assets exist (fail loud, never ship an empty release)
        run: |
          set +e
          count=$(ls dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          echo "asset archives: $count"
          test "$count" -eq 5 && exit 0
          {
            echo "::error::expected 5 archives (4 tar.gz + 1 zip), found $count"
            echo "dist contents:"
            ls -la dist
            echo "--- raw dir ---"
            find dist -maxdepth 2 | head -40
          } >&2
          exit 1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
