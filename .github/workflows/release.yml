name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: sabdopalon
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: sabdopalon
          # macOS
          - os: macos
            arch: x86_64
            runner: macos-13
            goos: darwin
            goarch: amd64
            binary: sabdopalon
          - os: macos
            arch: aarch64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: sabdopalon
          # Windows
          - os: windows
            arch: x86_64
            runner: windows-latest
            goos: windows
            goarch: amd64
            binary: sabdopalon.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o ${{ matrix.binary }} ./cmd/sabdopalon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabdopalon-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.binary }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          cd dist
          # Rename binaries with OS+arch suffix
          for dir in sabdopalon-linux-x86_64 sabdopalon-linux-aarch64 sabdopalon-macos-x86_64 sabdopalon-macos-aarch64 sabdopalon-windows-x86_64; do
            if [ -f "$dir/sabdopalon" ]; then
              mv "$dir/sabdopalon" "sabdopalon-$dir"
            elif [ -f "$dir/sabdopalon.exe" ]; then
              mv "$dir/sabdopalon.exe" "sabdopalon-$dir.exe"
            fi
          done
          # Compress: tar.gz for Linux/macOS, zip for Windows
          for f in sabdopalon-linux-* sabdopalon-macos-*; do
            [ -f "$f" ] && tar czf "$f.tar.gz" "$f"
          done
          for f in sabdopalon-windows-*.exe; do
            [ -f "$f" ] && zip "$f.zip" "$f"
          done
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
