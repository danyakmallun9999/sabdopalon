name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    name: Build dashboard UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build React dashboard
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: internal/dashboard/ui/dist/

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: ui
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            arch: x86_64
            goos: linux
            goarch: amd64
            binary: sabdopalon
          - os: linux
            arch: aarch64
            goos: linux
            goarch: arm64
            binary: sabdopalon
          # macOS (cross-compiled — Go does not require a matching host)
          - os: macos
            arch: x86_64
            goos: darwin
            goarch: amd64
            binary: sabdopalon
          - os: macos
            arch: aarch64
            goos: darwin
            goarch: arm64
            binary: sabdopalon
          # Windows (cross-compiled)
          - os: windows
            arch: x86_64
            goos: windows
            goarch: amd64
            binary: sabdopalon.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/dashboard/ui/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.binary }} ./cmd/sabdopalon
          # Upload with the FINAL asset name so the release job can flatten.
          name="sabdopalon-${{ matrix.os }}-${{ matrix.arch }}"
          case "${{ matrix.binary }}" in *.exe) name="$name.exe";; esac
          cp "${{ matrix.binary }}" "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabdopalon-${{ matrix.os }}-${{ matrix.arch }}
          path: sabdopalon-${{ matrix.os }}-${{ matrix.arch }}*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts (flat)
        uses: actions/download-artifact@v4
        with:
          pattern: sabdopalon-*
          path: dist
          merge-multiple: true

      - name: Package release assets
        shell: python3 {0}
        run: |
          import glob, os, zipfile, tarfile
          os.chdir("dist")
          files = sorted(os.listdir("."))
          print("dist before:", files)
          made = []
          for f in glob.glob("sabdopalon-windows-*.exe"):
              with zipfile.ZipFile(f + ".zip", "w", zipfile.ZIP_DEFLATED) as z:
                  z.write(f, f)
              made.append(f + ".zip")
          for f in glob.glob("sabdopalon-linux-*") + glob.glob("sabdopalon-macos-*"):
              with tarfile.open(f + ".tar.gz", "w:gz") as t:
                  t.add(f)
              made.append(f + ".tar.gz")
          for f in glob.glob("sabdopalon-*"):
              os.remove(f)
          print("archives made:", sorted(made))
          print("dist after:", sorted(os.listdir(".")))
          assert len(made) == 5, f"expected 5 archives, made {len(made)}"

      - name: Verify assets exist (fail loud, never ship an empty release)
        shell: python3 {0}
        run: |
          import os, sys
          dist = sorted(os.listdir("dist"))
          archives = [f for f in dist if f.endswith((".tar.gz", ".zip"))]
          if len(archives) != 5:
              print(
                  "::error::expected 5 archives, found %d | dist=%s"
                  % (len(archives), ",".join(dist))
              )
              sys.exit(1)
          print("verified:", ", ".join(archives))

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
