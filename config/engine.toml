# Sabdopalon configuration — regenerated by the dashboard.
# Docs: https://github.com/danyakmallun9999/sabdopalon

[sabdopalon]
tld = "localhost"
root = "./sites"
logs = "./logs"
data = "./data"

[proxy]
http_port = 8080
https_port = 8443

[php]
# empty = auto-detect (bundled → PATH → system)
binary = "/home/danyakmallun/.config/herd-lite/bin/php"

[database]
engine = "mariadb"
path = "./data/sabdopalon.db"
port = 3306

[dashboard]
enabled = true
port = 9900
auto_open = true

[services]
mailpit = false
redis = false
minio = false
meilisearch = false
