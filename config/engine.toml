# Sabdopalon configuration — regenerated by the dashboard.
# Docs: https://github.com/danyakmallun9999/sabdopalon

[sabdopalon]
tld = "localhost"
root = "./sites"
logs = "./logs"
data = "./data"

[proxy]
http_port = 80
https_port = 8443
# false = site only from this machine (127.0.0.1). true = open to the LAN.
lan = false

[php]
# binary = "" means auto-detect. The order is: this binary -> [php] prefer ->
# the bundled bin/php/X.Y - and only then the first php on PATH.
#
# "bundled" is the default: Sabdopalon ships a PHP built for this stack, while a
# php.exe found on PATH belongs to some other product, with its own php.ini,
# extensions and curl. Set prefer = "system" to use that one instead.
binary = "C:\sabdopalon\bin\php.cmd"
# prefer = "system"   # or "bundled" (the default)

[database]
engine = "mariadb"
path = "./data/sabdopalon.db"
port = 3306
# Multi-daemon: every database may run at once, each with its own port.
mariadb_enabled = true
mariadb_port = 3306
pg_enabled = true
pg_port = 5433

[dashboard]
enabled = true
port = 9900
auto_open = true

[services]
mailpit = false
redis = false
minio = false
meilisearch = false
