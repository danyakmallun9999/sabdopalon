<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabdopalon — {{.Page}}</title>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/app.js"></script>
</head>
<body>
<aside class="sidebar">
  <div class="brand">🐫 <span>Sabdopalon</span><small>v{{.Version}}</small></div>
  <nav>
    <a href="/sites"    class="{{if eq .Page "sites"}}active{{end}}">🌐 Sites</a>
    <a href="/database" class="{{if eq .Page "database"}}active{{end}}">🗄️ Database</a>
    <a href="/packages" class="{{if eq .Page "packages"}}active{{end}}">📦 Packages</a>
    <a href="/ssl"      class="{{if eq .Page "ssl"}}active{{end}}">🔒 SSL / HTTPS</a>
    <a href="/settings" class="{{if eq .Page "settings"}}active{{end}}">⚙️ Settings</a>
    <a href="/logs"     class="{{if eq .Page "logs"}}active{{end}}">📜 Logs</a>
  </nav>
  <div class="sidebar-footer">
    <span id="status-dot" class="dot"></span>
    <span id="status-text">connecting…</span>
  </div>
</aside>

<main>
{{template "content" .}}
</main>

<div id="toast" role="alert"></div>
</body>
</html>
