{{define "content"}}
<h1>🗄️ Database</h1>
<p class="sub">SQLite works with zero setup. MariaDB/MySQL is managed automatically once installed.</p>

<div class="card">
  <h2>Engine <span><span id="engine-badge" class="badge off">…</span></span></h2>
  <p class="hint" id="engine-hint"></p>
</div>

<div class="card">
  <h2>💾 Backups <button class="btn" onclick="doBackup()">Backup Now</button></h2>
  <div id="backups-list"></div>
</div>

<script>
poll(async () => {
  const s = await api('/api/status');
  if (!s || s.error) return;
  const b = document.getElementById('engine-badge');
  b.textContent = s.database;
  b.className = 'badge' + (s.database === 'sqlite' ? '' : '');
  document.getElementById('engine-hint').textContent =
    s.database === 'sqlite'
      ? 'Apps connect via PDO SQLite. The file lives in data/sabdopalon.db — switch engines anytime from Settings.'
      : `The ${s.database} daemon starts and stops together with Sabdopalon.`;
}, 5000);

async function doBackup() {
  const r = await post('/api/backup');
  toast(r.message || r.error, !!r.error);
  loadBackups();
}

async function loadBackups() {
  const list = await api('/api/backups');
  const div = document.getElementById('backups-list');
  if (!Array.isArray(list) || !list.length) {
    div.innerHTML = '<p class="empty">No backups yet — click “Backup Now”.</p>';
    return;
  }
  div.innerHTML = '<table><thead><tr><th>Name</th><th>Size</th><th>Created</th></tr></thead><tbody>' +
    list.map(b => `<tr><td>${esc(b.name)}</td><td>${(b.size/1024).toFixed(0)} KB</td><td>${esc(b.time)}</td></tr>`).join('') +
    '</tbody></table>';
}
poll(loadBackups, 8000);
</script>
{{end}}
