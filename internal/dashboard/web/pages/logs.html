{{define "content"}}
<h1>📜 Logs</h1>
<p class="sub">Per-site PHP logs plus database and Mailpit output. Newest lines at the bottom.</p>

<div class="card">
  <div class="tabs" id="tabs"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
    <span class="hint" id="log-file"></span>
    <label class="hint"><input type="checkbox" id="auto" checked style="width:auto"> auto-refresh</label>
  </div>
  <div class="log-box" id="box">Loading…</div>
</div>

<script>
let current = null;
const qs = new URLSearchParams(location.search);
const preset = qs.get('site');

async function loadSites() {
  const sites = await api('/api/sites');
  if (!Array.isArray(sites)) return;
  const names = sites.map(s => s.name).concat(['database', 'mailpit']);
  const tabs = document.getElementById('tabs');
  if (!current && names.length) current = preset || names[0];
  tabs.innerHTML = names.map(n =>
    `<span class="tab ${n === current ? 'active' : ''}" data-name="${esc(n)}" onclick="pick('${esc(n)}')">${esc(n)}</span>`).join('');
}
poll(loadSites, 6000);

function pick(name) { current = name; loadLog(); }

async function loadLog() {
  if (!current) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.name === current));
  const d = await api('/api/logs/' + encodeURIComponent(current));
  const box = document.getElementById('box');
  if (d.error) { box.textContent = d.error; document.getElementById('log-file').textContent = ''; return; }
  document.getElementById('log-file').textContent = 'logs/' + d.file;
  box.innerHTML = d.lines.map(l => `<div class="log-line">${esc(l)}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

setInterval(() => { if (document.getElementById('auto').checked) loadLog(); }, 2500);
loadLog();
</script>
{{end}}
