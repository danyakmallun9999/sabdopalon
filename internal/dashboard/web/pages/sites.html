{{define "content"}}
<h1>🌐 Sites</h1>
<p class="sub">Every folder in <code class="inline">sites/</code> is automatically served at <code class="inline">name.{{.TLD}}</code>.</p>

<div class="card" style="display:flex;justify-content:flex-end">
  <button class="btn" onclick="openWizard()">＋ New Site</button>
</div>

<div id="sites" class="grid"></div>

<script>
const templates = [
  {id:'blank', label:'Blank PHP'},
  {id:'laravel', label:'Laravel (needs composer)'},
  {id:'wordpress', label:'WordPress (downloads latest)'},
  {id:'codeigniter', label:'CodeIgniter 4 (needs composer)'},
];

function openWizard() {
  const opts = templates.map(t => `<option value="${t.id}">${t.label}</option>`).join('');
  const m = openModal(`
    <h2>＋ New Site</h2>
    <div class="field"><label>Site name (becomes name.{{.TLD}})</label>
      <input id="wz-name" placeholder="my-app" autofocus></div>
    <div class="field"><label>Template</label><select id="wz-tmpl">${opts}</select></div>
    <div class="row">
      <button class="btn secondary" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
      <button class="btn" onclick="createSite(this)">Create</button>
    </div>`);
}

async function createSite(btn) {
  const name = document.getElementById('wz-name').value.trim();
  const template = document.getElementById('wz-tmpl').value;
  if (!name) { toast('Enter a site name first', true); return; }
  btn.disabled = true;
  const r = await post('/api/sites', {name, template});
  if (r.error) { toast(r.error, true); btn.disabled = false; return; }
  btn.closest('.modal-backdrop').remove();
  toast(r.message || `Created ${name}`);
  loadSites();
}

async function act(name, action) {
  const r = await post(`/api/sites/${encodeURIComponent(name)}/${action}`);
  if (r.error) toast(r.error, true);
  else if (action !== 'start' && action !== 'stop') toast(`${name}: ${action} ok`);
  loadSites();
}

async function delSite(name) {
  if (!confirm(`Move "${name}" to .trash/?\n\nThe folder is not deleted permanently.`)) return;
  const r = await api('/api/sites/' + encodeURIComponent(name), {method: 'DELETE'});
  if (r.error) toast(r.error, true); else toast(r.message || 'moved to trash');
  loadSites();
}

async function loadSites() {
  const sites = await api('/api/sites');
  const el = document.getElementById('sites');
  if (!Array.isArray(sites)) { el.innerHTML = `<div class="empty">${esc(sites && sites.error || 'error')}</div>`; return; }
  if (!sites.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1">No sites yet — click “New Site” or create a folder under <code class="inline">sites/</code>.</div>`;
    return;
  }
  el.innerHTML = sites.map(s => `
    <div class="site-card">
      <div class="head">
        <span class="name">${esc(s.name)}</span>
        <span class="badge ${s.running ? '' : 'off'}">${s.running ? 'running' : 'stopped'}</span>
      </div>
      <div class="url">
        <a href="${esc(s.url)}" target="_blank">${esc(s.url)}</a><br>
        <a href="${esc(s.https)}" target="_blank" title="HTTPS">${esc(s.https.replace('https://',''))}</a>
        ${s.php ? `<span class="badge warn" style="margin-left:.4rem">PHP ${esc(s.php)}</span>` : ''}
      </div>
      <div class="actions">
        <button class="btn small" onclick="act('${esc(s.name)}','${s.running ? 'stop' : 'start'}')">${s.running ? '⏹ Stop' : '▶ Start'}</button>
        ${s.running ? `<button class="btn small secondary" onclick="act('${esc(s.name)}','restart')">↻ Restart</button>` : ''}
        <a class="btn small secondary" href="/logs?site=${encodeURIComponent(s.name)}">📜 Logs</a>
        <button class="btn small danger" onclick="delSite('${esc(s.name)}')">🗑 Delete</button>
      </div>
    </div>`).join('');
}
poll(loadSites, 4000);
</script>
{{end}}
