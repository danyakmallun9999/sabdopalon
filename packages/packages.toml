# Meilisearch — instant search engine (single binary).
# version = "latest" floats: SHA pins would break on every upstream release,
# so integrity relies on HTTPS + first-download lockfile (see header).
# Upstream asset names differ from our {goos}-{march} scheme → explicit URLs.
[meilisearch]
version = "latest"
url = "https://github.com/meilisearch/meilisearch/releases/latest/download/meilisearch-linux-amd64"
url_linux_aarch64 = "https://github.com/meilisearch/meilisearch/releases/latest/download/meilisearch-linux-aarch64"
url_macos_x86_64 = "https://github.com/meilisearch/meilisearch/releases/latest/download/meilisearch-macos-amd64"
url_macos_aarch64 = "https://github.com/meilisearch/meilisearch/releases/latest/download/meilisearch-macos-apple-silicon"
url_windows = "https://github.com/meilisearch/meilisearch/releases/latest/download/meilisearch-windows-amd64.exe"
target = "meilisearch"
binary_name = "meilisearch"
type = "binary"
verify_path = "meilisearch.exe meilisearch"
license = "MIT"

# Redis — in-memory cache & queue (Windows bundled port; Linux/macOS use
# the system redis-server via PATH fallback — see the redis service spec).
# The tporadowski zip is FLAT (no top-level folder): strip_root MUST stay false,
# otherwise every entry is skipped and the install ends up silently empty.
[redis]
version = "5.0.14.1"
url_windows = "https://github.com/tporadowski/redis/releases/download/v{version}/Redis-x64-{version}.zip"
sha256_windows_x64 = "018ea18a35876383cbb5f4cd0258adfc87747cf9d619bce1cf73a2e36f720ccf"
target = "redis"
strip_root = false
type = "zip"
verify_path = "redis-server.exe"
license = "BSD-3-Clause"

# phpMyAdmin — web database GUI (served as a site at phpmyadmin.localhost).
# Platform-neutral artifact: one generic sha256 applies to every OS/arch.
[phpmyadmin]
version = "5.2.3"
url = "https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-all-languages.tar.gz"
sha256 = "12ba1c425fa4071abbd4e7668c9ebdeac0b0755a467a6d6d5026122bb47c102b"
target = "phpmyadmin"
strip_root = true
type = "tar.gz"
# Canary for partial-extraction detection (the file that goes missing first
# when a tree is incompletely copied).
verify_path = "libraries/constants.php"
license = "GPL-2.0"

# Adminer — single-file database web GUI (served as a site).
