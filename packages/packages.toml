# PostgreSQL (embedded builds from zonky — tiny, includes initdb/pg_ctl).
# Inner archive is tar.xz; extraction shells out to system tar+xz
# (Windows 10+ ships bsdtar which handles xz; otherwise a clear hint is shown).
# Upstream classifiers use amd64/arm64v8 — hence the arm64v8 overrides below.
[postgresql]
version = "17.10.0"
url = "https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-{goos}-{march}/{version}/embedded-postgres-binaries-{goos}-{march}-{version}.jar"
