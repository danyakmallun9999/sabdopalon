# Package definitions for Sabdopalon's package system.
#
# Install with:
#   sabdopalon add <name>          e.g. sabdopalon add mariadb
#   sabdopalon add php@8.3         shorthand for the versioned PHP packages
#
# Binaries are extracted to bin/<target>/.
#
# URL templates support placeholders:
#   {os}            → linux, macos, windows
#   {arch}          → x86_64, aarch64, x64
#   {version}       → the version field (version_windows on Windows builds)
#   {version_short} → major.minor of {version} (used in target paths)
#
# type can be: "tar.gz" (default), "binary" (single executable), "zip"
#
# Checksums: sha256_<os>_<arch> pins are verified on install. Platforms
# without a pin use an automatic lockfile recorded after the first verified
# download (bin/<target>.../.sabdopalon-sha256 style locks under bin/).

[mariadb]
version = "11.4.13"
url = "https://archive.mariadb.org/mariadb-11.4.13/bintar-linux-systemd-x86_64/mariadb-11.4.13-linux-systemd-x86_64.tar.gz"
sha256_linux_x86_64 = "fa2f594c3ab0d4f4e611c79a63e5ebf0e15558ce971963d64df3bcaced1b135a"
target = "mariadb"
strip_root = true
type = "tar.gz"
license = "GPL-2.0 (with FOSS exception)"

# Default PHP — installed by `sabdopalon add php` and by first-run auto-download.
[php]
# static-php.dev provides self-contained static PHP binaries with 30+
# extensions (pdo_mysql, pdo_sqlite, curl, gd, mbstring, zip, opcache, ...).
# Source: https://dl.static-php.dev/static-php-cli/common/
version = "8.5.8"
version_windows = "8.5.7"
url = "https://dl.static-php.dev/static-php-cli/common/php-{version}-cli-{os}-{arch}.tar.gz"
url_windows = "https://dl.static-php.dev/static-php-cli/windows/spc-min/php-{version}-cli-win.zip"
sha256_linux_x86_64 = "517a18e0f0874de35669fe134eb3c52508e128a6d1da5bf890760cb800ada410"
target = "php/{version_short}"
strip_root = false
type = "tar.gz"
license = "PHP License"

