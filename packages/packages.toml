sha256_linux_aarch64 = "86ea1fe2f6d2415eff78c2e0bcb479b221d5637c89d72e19809b65c4c0527c27"
sha256_macos_aarch64 = "5e5032e8244a2367b1e8a9c70ff6f793dee7433966c9291da85fadf2167cd55f"
