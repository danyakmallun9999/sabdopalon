# Package definitions for Sabdopalon's package system.
#
# Install with:
#   sabdopalon add <name>          e.g. sabdopalon add mariadb
#   sabdopalon add php@8.3         shorthand for the versioned PHP packages
#
# Binaries are extracted to bin/<target>/.
#
# URL templates support placeholders:
#   {os}            → linux, macos, windows
#   {arch}          → x86_64, aarch64, x64
#   {version}       → the version field (version_windows on Windows builds)
#   {version_short} → major.minor of {version} (used in target paths)
#
# type can be: "tar.gz" (default), "binary" (single executable), "zip"
# type_windows overrides type when the url_windows artifact has a different
# container format (e.g. MariaDB/PHP ship zip on Windows, tar.gz elsewhere).
#
# Checksums: sha256_<os>_<arch> pins are verified on install. A generic
# "sha256" key applies to EVERY platform (platform-neutral artifacts such as
# phpMyAdmin). Floating versions ("latest") cannot be pinned safely — they
# rely on HTTPS plus an automatic lockfile recorded after the first verified
# download (trust-on-first-use).
#
# verify_path lists essential files (relative to the install target, space
# separated, first existing wins) that must be present for the package to
# count as installed — protects against silently-empty or partial installs.

[mariadb]
version = "11.4.13"
# Linux tarball is x86_64-only; Windows needs its own zip (platform_specific).
url = "https://archive.mariadb.org/mariadb-11.4.13/bintar-linux-systemd-x86_64/mariadb-11.4.13-linux-systemd-x86_64.tar.gz"
sha256_linux_x86_64 = "fa2f594c3ab0d4f4e611c79a63e5ebf0e15558ce971963d64df3bcaced1b135a"
url_windows = "https://archive.mariadb.org/mariadb-11.4.13/winx64-packages/mariadb-{version}-winx64.zip"
sha256_windows_x64 = "d62986d433eeebfde218560b276103831604a61e929e87f1a17f5aebd80257e2"
target = "mariadb"
strip_root = true
type = "tar.gz"
type_windows = "zip"
# The generic URL above is a Linux artifact — never fall back to it on Windows.
platform_specific = true
# Essential daemon binary (first existing entry wins, per platform).
verify_path = "bin/mariadbd.exe bin/mariadbd"
license = "GPL-2.0 (with FOSS exception)"

# Default PHP — installed by `sabdopalon add php` and by first-run auto-download.
[php]
# static-php.dev self-contained static PHP binaries. The "bulk" combo ships
# ~55 extensions INCLUDING mysqli/pdo_mysql/gd/zip/intl — phpMyAdmin refuses
# to run without mysqli, and the smaller "common" combo has only pdo_mysql.
# Source: https://dl.static-php.dev/static-php-cli/bulk/
# Windows has no bulk build; "spc-max" is the fullest Windows combo (mysqli,
# gd, zip, curl...). spc-max 8.5.5 is the newest Windows asset — hence the
# older version_windows.
# NOTE: in url_windows, {version} automatically resolves to version_windows.
version = "8.5.8"
version_windows = "8.5.5"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-cli-{os}-{arch}.tar.gz"
url_windows = "https://dl.static-php.dev/static-php-cli/windows/spc-max/php-{version}-cli-win.zip"
